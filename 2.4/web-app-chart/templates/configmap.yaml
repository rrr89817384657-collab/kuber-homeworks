apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>{{ .Values.app.title }}</title>
    </head>
    <body>
      <h1>{{ .Values.app.message }}</h1>
      <p>Version: {{ .Values.image.tag }}</p>
      <p>Namespace: {{ .Release.Namespace }}</p>
      <p>Release: {{ .Release.Name }}</p>
    </body>
    </html>
